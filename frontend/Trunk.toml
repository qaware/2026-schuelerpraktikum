[build]
target = "index.html"
dist = "dist"

[watch]
ignore = []

[serve]
address = "127.0.0.1"
port = 8080
open = false

[clean]
dist = "dist"

# Forward API calls to the backend so the browser only ever talks to the Trunk
# origin. Each entry mounts at the path of its backend URL, so they have to be
# listed per prefix -- a bare "http://localhost:8585" would mount at / and
# swallow the app itself.
[[proxy]]
backend = "http://localhost:8585/satellites"

[[proxy]]
backend = "http://localhost:8585/data"

[[proxy]]
backend = "http://localhost:8585/health"

[[proxy]]
backend = "http://localhost:8585/admin"

[[hooks]]
stage = "pre_build"
command = "npx"
command_arguments = ["@tailwindcss/cli", "-i", "input.css", "-o", "output.css"]
