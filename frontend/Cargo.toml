[package]
name = "frontend"
version = "0.1.0"
edition = "2021"
description = "Schülerpraktikum Leptos CSR Frontend"

[dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = { version = "0.8.15" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
log = "0.4.33"
console_log = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
gloo-net = "0.7.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3"


[package.metadata.leptos]
assets-dir = "public"
