services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - 27017:27017

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://root:password@mongodb:27017
      ADDR: ":8585"
      DATAGEN_URL: http://datagen:8090
    ports:
      - 8585:8585

  # Fuellt die Datenbank mit Telemetrie, sonst bleibt das Dashboard leer: das
  # Backend legt Satelliten erst an, wenn Messwerte per POST /data ankommen.
  # Nur zur Entwicklung - wer echte Daten einspielt, kann den Service mit
  # 'docker compose up mongodb backend frontend' weglassen.
  datagen:
    build:
      context: ./tools
      dockerfile: Dockerfile
    container_name: datagen
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      INGEST_URL: http://backend:8585/data
    ports:
      - 8090:8090

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    # nginx resolves the "backend" upstream when it loads its config, so that
    # container has to exist first or nginx exits with "host not found".
    depends_on:
      - backend
    ports:
      - 8686:80